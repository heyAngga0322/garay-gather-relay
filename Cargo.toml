[package]
name = "webrtc-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await", "io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rtc = "0.20.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-tungstenite = "0.27"
webrtc = "0.20.5"
