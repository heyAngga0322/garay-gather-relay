[package]
name = "garay"
version = "0.1.0"
edition = "2024"

[lib]
name = "garay"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await", "io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"
rtc = "0.20.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.27", features = ["rustls"] }
webrtc = "0.20.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
config = { version = "0.15", features = ["toml"] }
rustls-pemfile = "1.0"
thiserror = "1.0"

[dev-dependencies]
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.27", features = ["rustls"] }
serial_test = "3.0"
